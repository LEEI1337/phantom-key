global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'homelab-aggregator'
    static_configs:
      - targets: ['aggregator:3000']
    scrape_interval: 5s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  # Add your existing Prometheus instances if needed
  # - job_name: 'existing-prometheus'
  #   static_configs:
  #     - targets: ['your-existing-prometheus:9090']
