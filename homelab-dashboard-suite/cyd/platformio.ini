; PlatformIO Project Configuration File for CYD (Cheap Yellow Display)
; ESP32-2432S028R

[env:cyd]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200
upload_speed = 921600

; Build Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    
; Libraries
lib_deps = 
    lovyan/LovyanGFX@^1.1.12
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.3.7
    knolleary/PubSubClient@^2.8
    robtillaart/INA226@^0.4.2

; Board Configuration
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_upload.psram_available = true

; Debug Settings
debug_tool = esp-prog
debug_init_break = tbreak setup

[env:cyd-dev]
extends = env:cyd
build_type = debug
build_flags = 
    ${env.build_flags}
    -D DEBUG_MODE=1
