; PlatformIO Project Configuration File
; CYD Homelab Dashboard Firmware

[env:cyd]
platform = espressif32@5.2.0
board = esp32dev
framework = arduino

; Board Settings
board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DESP32=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=25000000
    -DTOUCH_CS=-1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Libraries
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.3.7
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    lorol/LovyanGFX@^1.1.12

; Serial Monitor
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

; Upload Protocol
upload_protocol = esptool
