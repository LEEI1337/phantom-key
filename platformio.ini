; ============================================
; ESP-Key: BLE Macro Keyboard
; ESP32-C3 Super Mini
; ============================================
; State of the Art: December 2025
; - pioarduino 55.03.35 (Arduino 3.3.5 + ESP-IDF 5.5.1)
; - NimBLE-Arduino 2.3.7
; - ESP32-BLE-Keyboard with Arduino 3.x fixes
; ============================================

[env:esp32c3]
; WICHTIG: Arduino 3.x hat BLE-Probleme auf ESP32-C3!
; Wir nutzen offizielles platformio/espressif32 mit Arduino 2.x (stabil)
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino

; Serial
monitor_speed = 115200
upload_speed = 921600

; Libraries für Arduino 2.x
lib_deps =
    ; NimBLE 1.4.x funktioniert gut mit Arduino 2.x / ESP-IDF 4.x
    h2zero/NimBLE-Arduino@^1.4.0
    ; NeoPixel für LED-Effekte
    adafruit/Adafruit NeoPixel@^1.12.0

; Build flags for ESP32-C3 with NimBLE (Arduino 2.x)
build_flags =
    ; Use NimBLE statt Bluedroid (spart ~100KB RAM)
    -D USE_NIMBLE=1
    ; USB CDC for Serial output
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Optimize for size
    -Os

; Partition table (default is fine for this project)
board_build.partitions = default.csv

; Extra: enable core debug for development
; build_type = debug
; build_flags = -DCORE_DEBUG_LEVEL=4
